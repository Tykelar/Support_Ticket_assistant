[project]
name = "support-assistant"
version = "0.1.0"
description = "Auto-reply service for EV-charging customer support tickets"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]
# Optional bonus: real LLM behind the same protocol. Never required to run the service.
ollama = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers -m 'not docker'"
markers = [
    "e2e: end-to-end tests exercising the API and full pipeline",
    "docker: builds the image and exercises the running container (needs Docker; excluded by default -- run with `pytest -m docker`)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
