name: support-ticket-assistant

# One service. SQLite is a file and the pipeline runs in-process (ADR 0001 / ADR 0003),
# so there is no database container and no broker -- a compose that starts one thing is a
# truthful description of the architecture (PACKAGING.md).

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: support-ticket-assistant:latest
    ports:
      # Host port 8000 by default (PACKAGING.md); set HOST_PORT to move it if 8000 is
      # already taken on the machine.
      - "${HOST_PORT:-8000}:8000"
    environment:
      # Every value below is the built-in default (PACKAGING.md's config table). They are
      # spelled out so the configuration surface is visible and easy to override.
      MAX_ITERATIONS: "5"
      DATABASE_PATH: "data/tickets.db"          # under WORKDIR /app -> on the volume below
      LLM_PROVIDER: "fake"                      # `ollama` lands in phase 11; any value uses FakeLLM today
      OLLAMA_BASE_URL: "http://localhost:11434"
      LOG_LEVEL: "info"
    volumes:
      # The SQLite file lives on a named volume so traces survive `docker compose restart`
      # (PACKAGING.md). `docker compose down -v` is what discards it.
      - ticket-data:/app/data

volumes:
  ticket-data:
